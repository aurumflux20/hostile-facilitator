# Publishes to PyPI via Trusted Publishing (OIDC) — no token stored anywhere,
# in this repo or on PyPI. Fires when a version tag is pushed.
# One-time setup on pypi.org (account owner): add a pending publisher for
# project "hostile-facilitator", owner aurumflux20, repo hostile-facilitator,
# workflow publish.yml, environment pypi.
name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade build pytest
      - name: tests must pass before anything ships
        run: python3 -m pytest tests/ -q
      - name: the instrument must stay honest
        run: python3 -m hostile_facilitator.cli selftest
      - run: python3 -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token PyPI trusts — this is the whole mechanism
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
